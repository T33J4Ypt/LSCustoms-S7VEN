<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LS Customs - Calculadora de Fabricação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="logo-header">
  <img src="LSC-Header.png" alt="LS Customs" class="site-logo">
</div>

    <!-- Navegação entre Páginas -->
    <nav class="nav-tabs">
      <a href="index.html" class="nav-btn active">Calculadora de Fabricação</a>
      <a href="precos.html" class="nav-btn">Tabela de Preços</a>
    </nav>

    <div class="actions">
      <button id="btn-limpar" type="button" class="button-secondary">Limpar Tudo</button>
    </div>

    <!-- Tabela de Fabricação -->
    <div class="table-card">
      <h2>Calculadora de Fabricação</h2>
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd.</th>
            <th>Materiais Necessários</th>
          </tr>
        </thead>
        <tbody id="tabela-fabricacao"></tbody>
      </table>
    </div>

    <!-- Totais de Materiais -->
    <div class="table-card">
      <h2>Total de Materiais</h2>
      <table>
        <thead>
          <tr>
            <th>Material</th>
            <th>Quantidade Total</th>
          </tr>
        </thead>
        <tbody id="tabela-totais">
          <tr>
            <td colspan="2" class="empty-msg">Nenhum item selecionado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="fabricacao.js"></script>
</body>
</html>
